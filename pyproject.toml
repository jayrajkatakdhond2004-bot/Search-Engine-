[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minisearch"
version = "0.1.0"
description = "A full-text search engine built from scratch: analyzer, segmented compressed inverted index, BM25/TF-IDF, boolean/phrase/wildcard queries, crawler and benchmarks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "ruff>=0.4", "matplotlib>=3.8", "nltk>=3.8"]

[project.scripts]
minisearch = "minisearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minisearch = ["ui/*", "analysis/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["E501", "SIM108"]
